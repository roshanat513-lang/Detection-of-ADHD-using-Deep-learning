# === ADHD-EEG-Net configuration ===

data:
  format: npy                 # "npy" or "edf"
  npy_x_path: data/X.npy      # shape (n_epochs, n_channels, n_timesteps)
  npy_y_path: data/y.npy      # shape (n_epochs,) -> 0=control, 1=adhd
  npy_groups_path: data/groups.npy   # subject id per epoch, for subject-wise splitting
  edf_adhd_dir: data/adhd/
  edf_control_dir: data/control/
  sampling_rate: 128          # Hz
  n_channels: 19
  epoch_length_sec: 4.0
  epoch_overlap: 0.5
  bandpass_low: 0.5
  bandpass_high: 40.0
  notch_freq: 50.0

model:
  name: eegnet                # "eegnet" or "cnn_lstm"
  eegnet:
    F1: 8
    D: 2
    F2: 16
    kernel_length: 64
    dropout: 0.25
  cnn_lstm:
    cnn_channels: [16, 32, 64]
    lstm_hidden: 64
    lstm_layers: 1
    bidirectional: true
    dropout: 0.3
  num_classes: 2

train:
  batch_size: 32
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  k_folds: 5
  seed: 42
  device: auto                # "auto", "cpu", or "cuda"
  class_weighted_loss: true
  checkpoint_dir: checkpoints/
  log_dir: logs/

evaluate:
  batch_size: 32
  metrics: [accuracy, precision, recall, f1, roc_auc]
